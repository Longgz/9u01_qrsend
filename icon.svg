<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#1e293b" stroke-width="8"/>
  
  <!-- QR Outer finder patterns -->
  <!-- Top-Left -->
  <rect x="96" y="96" width="112" height="112" rx="20" fill="none" stroke="url(#accent)" stroke-width="20"/>
  <rect x="128" y="128" width="48" height="48" rx="8" fill="url(#accent)"/>
  
  <!-- Top-Right -->
  <rect x="304" y="96" width="112" height="112" rx="20" fill="none" stroke="url(#accent)" stroke-width="20"/>
  <rect x="336" y="128" width="48" height="48" rx="8" fill="url(#accent)"/>
  
  <!-- Bottom-Left -->
  <rect x="96" y="304" width="112" height="112" rx="20" fill="none" stroke="url(#accent)" stroke-width="20"/>
  <rect x="128" y="336" width="48" height="48" rx="8" fill="url(#accent)"/>
  
  <!-- Center Download Arrow -->
  <g transform="translate(304, 304)">
    <circle cx="56" cy="56" r="56" fill="url(#accent)"/>
    <path d="M56 32v40M40 56l16 16 16-16" fill="none" stroke="#042f1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Data dots -->
  <circle cx="256" cy="152" r="12" fill="#94a3b8"/>
  <circle cx="256" cy="200" r="12" fill="#94a3b8"/>
  <circle cx="256" cy="256" r="16" fill="#38bdf8"/>
  <circle cx="200" cy="256" r="12" fill="#94a3b8"/>
  <circle cx="152" cy="256" r="12" fill="#94a3b8"/>
</svg>

